l_english:
 doctrine_polygamy_name:0 "Blood-Wives"
 doctrine_polygamy_desc:0 "Forty spouses and forty concubines, for men and for women. Who is a wife and who is a concubine is yours to choose."
 doctrine_parameter_jen_blood_wives_law:0 "Forty spouses and forty [concubines|E] for men and women. Who shares the bed is yours to choose."
 doctrine_parameter_men_can_have_multiple_spouses:0 "Men may take several spouses"
 doctrine_parameter_women_can_have_multiple_spouses:0 "Women may take several spouses"
 doctrine_parameter_men_can_have_consorts:0 "Men may take [concubines|E]"
 doctrine_parameter_women_can_have_consorts:0 "Women may take [concubines|E]"
 tradition_jim_more_1_name:0 "More Traditions I"
 tradition_jim_more_1_desc:0 "This culture's people are flexible, able to follow many traditions."
 tradition_jen_lustful_dragonblood_name:0 "Lustful Dragonblood"
 tradition_jen_lustful_dragonblood_desc:0 "The blood runs hot. Many spouses and concubines, for men and for women. While health is Good or better, age does not close the door on children."
 culture_parameter_jen_lustful_dragonblood:0 "Strong blood: better health and more congenital traits. A household of many beds. While [health|E] is Good or better, you stay fertile past the usual years."
 jen_lustful_vital_fertility:0 "Vital Blood"
 jen_lustful_vital_fertility_desc:0 "Lustful Dragonblood. While health is Good or better, the blood keeps you fertile. Age does not shut the door."
