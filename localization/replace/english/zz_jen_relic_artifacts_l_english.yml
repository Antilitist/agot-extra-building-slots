l_english:
 jen_art_dragonbone_spear:0 "The Last Flight"
 jen_art_dragonbone_spear_desc:0 "Dragonbone, light as a lie. The last rider who held it did not come home. Prowess. Dragonriders notice."
 jen_art_bloodknife:0 "Nightglass"
 jen_art_bloodknife_desc:0 "Dragonglass worked to a ritual edge. Small prowess. The old blood likes the weight of it."
 jen_art_ash_scale_cloak:0 "Ash-Scale Cloak"
 jen_art_ash_scale_cloak_desc:0 "Fused scale that still smells of the Fourteen. Dread. Eyes follow. The body pays a little."
 jen_art_fused_bracers:0 "Fused Bracers"
 jen_art_fused_bracers_desc:0 "Stone and steel that ran together in the Doom. They remember a dragonlord's arms."
 jen_art_circlet_of_the_forty:0 "Circlet of the Forty"
 jen_art_circlet_of_the_forty_desc:0 "Gold for a seat among the Forty Families. Wear it only if the Dragon Court stands."
 jen_art_ash_crown:0 "Ash Crown"
 jen_art_ash_crown_desc:0 "A dread circlet pulled from shrine heat. Fear follows. So does stress."
 jen_art_book_songs_of_the_fourteen:0 "Songs of the Fourteen"
 jen_art_book_songs_of_the_fourteen_desc:0 "Hymns that still name the old gods correctly."
 jen_art_book_glass_treatise:0 "Treatise on Glass"
 jen_art_book_glass_treatise_desc:0 "How to wake a candle without burning the mind out. Mostly."
 jen_art_book_blood_ledger:0 "A Blood Ledger"
 jen_art_book_blood_ledger_desc:0 "A ruined house wrote who carried the blood. The ink lasted longer than the house."
 jen_art_glass_candle:0 "A Glass Candle"
 jen_art_glass_candle_desc:0 "One in the world. Light it, and a court opens. It costs sleep."
 jen_art_empty_shell:0 "Empty Shell"
 jen_art_empty_shell_desc:0 "A dragon egg that will never hatch. Keep it as a warning, not a hope."
 jen_art_fake_trinket:0 "Gilded Trinket"
 jen_art_fake_trinket_desc:0 "Pretty. False. Someone sold you a story."
 jen_art_dragonbone_spear_modifier:0 "$jen_art_dragonbone_spear$"
