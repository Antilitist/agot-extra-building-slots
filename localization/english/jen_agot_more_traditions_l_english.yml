l_english:
 jen_agot_unlock_tradition_slots_decision: "Unlock Extra Tradition Slots"
 jen_agot_unlock_tradition_slots_decision_desc: "AGOT cultures often start with more traditions than the era cap allows (for example #V 10/7#!). This grants your culture #P +20#! tradition slots without using a tradition slot itself, so you can add the extra traditions from your other mods.\n\nAlso #P clears#! any current 'wait until [date]' lock on establishing a new tradition (the leftover 50-year cooldown from before this patch)."
 jen_agot_unlock_tradition_slots_decision_tooltip: "Add +20 tradition slots and clear the tradition wait."
 jen_agot_unlock_tradition_slots_decision_confirm: "Open the ledger."
 jen_agot_clear_tradition_wait_tt: "The wait to establish a new tradition is cleared."
 jen_agot_add_building_slot_decision: "Debug: Add a Building Slot"
 jen_agot_add_building_slot_decision_desc: "Debug only. Adds #P +1#! building slot to every barony you hold. The Extra Building Slot building is the live way to expand holdings now."
 jen_agot_add_building_slot_decision_tooltip: "Add +1 building slot to each of your baronies."
 jen_agot_add_building_slot_decision_confirm: "Expand the holdings."
 jen_agot_add_building_slot_tt: "Every barony you hold gains #P +1#! building slot."
 building_type_jen_extra_slot_01: "Extra Building Slot"
 building_jen_extra_slot_01: "Extra Building Slot"
 building_type_jen_extra_slot_01_desc: "Local engineers expand the holding so more buildings can be raised.\n\nCompleting this project adds #P +1#! building slot, then the project is removed so the new slot stays free."
 building_jen_extra_slot_01_desc: "Local engineers expand the holding so more buildings can be raised."
 innovation_jen_agot_tradition_slots: "Expanded Tradition Ledger"
 innovation_jen_agot_tradition_slots_desc: "This culture keeps a deeper ledger of custom, so more traditions can be held at once."

 mod_mass_convert_subjects_decision: "Mass Conversion"
 mod_mass_convert_subjects_decision_desc: "Demand conversion from vassals, courtiers, tributaries, or house members of another faith."
 mod_mass_convert_subjects_decision_tooltip: "Send conversion demands to people of another faith."
 mod_mass_convert_subjects_decision_confirm: "Send requests"
